<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3a2a20">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="/admin/manifest.webmanifest">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Painel AM">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Painel de gestão</title>
<link rel="stylesheet" href="/assets/site.css">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body class="admin">
<div id="login" class="login" hidden>
  <form class="card" id="login-form" novalidate>
    <img class="login-logo brand-logo-img" src="/assets/img/logo-am.webp" alt="" width="90" height="64">
    <h1>Painel de gestão</h1>
    <p class="muted">Acesso privado. As clientes marcam pelo site.</p>
    <div class="field"><label for="l-email">Email</label><input class="input" id="l-email" type="email" autocomplete="username" required></div>
    <div class="field"><label for="l-pass">Palavra-passe</label><input class="input" id="l-pass" type="password" autocomplete="current-password" required></div>
    <div id="l-msg" role="alert"></div>
    <button class="btn block" type="submit">Entrar</button>
  </form>
</div>

<div id="shell" class="shell" hidden>
  <aside class="admin-side" id="side">
    <div class="admin-side-brand"><img class="brand-logo-img" src="/assets/img/logo-am.webp" alt="" width="58" height="41"><div><span id="biz">Adriana Martins Estética</span><small>Gestão</small></div></div>
    <nav id="menu" aria-label="Navegação principal"></nav>
    <div class="admin-side-foot"><div class="me"><span class="me-photo" id="side-photo"></span><div><b id="side-name"></b><a href="/" target="_blank" rel="noopener">Ver o site</a></div></div>
      <button class="btn tiny secondary block" id="logout"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h5v16h-5"/><path d="M10 8l-4 4 4 4M6 12h10"/></svg>Terminar sessão</button></div>
  </aside>
  <div class="main">
    <header class="topbar"><h1 id="view-title">Dashboard</h1><div class="top-actions" id="top-actions"></div></header>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="Navegação principal (telemóvel)"></nav>
</div>

<dialog id="dlg" aria-modal="true"><div class="dlg-body" id="dlg-body"></div></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="/admin/vendor/qrcode.js"></script>
<script src="/admin/admin.js"></script>
</body>
</html>
