# Netlify: páginas (pasta public) + servidor como Netlify Function (netlify/functions/api.js).
# A base de dados e as fotografias ficam no Netlify Blobs (incluído no Netlify, sem conta extra nem custos).
# Variáveis a definir no Netlify (Site configuration → Environment variables):
#   ADMIN_EMAIL     = amartinsestetica@icloud.com
#   ADMIN_PASSWORD  = palavra-passe do painel (mín. 10 caracteres; só é usada para criar a conta na 1.ª vez)
#   PUBLIC_BASE_URL = https://adrianamartins.netlify.app   (ou o domínio, quando houver)
[build]
  publish = "public"
  command = ""

[build.environment]
  NODE_VERSION = "22"
  # o email da Adriana é público (aparece no site como contacto), por isso não é um segredo:
  # sem isto, a verificação de segredos do Netlify bloqueia a publicação. A palavra-passe continua protegida.
  SECRETS_SCAN_OMIT_KEYS = "ADMIN_EMAIL,PUBLIC_BASE_URL"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # o better-sqlite3 só é usado fora do Netlify; aqui usa-se o sql.js (incluído no pacote da função)
  included_files = ["!node_modules/better-sqlite3/**", "!node_modules/node-addon-api/**", "!node_modules/bindings/**", "!node_modules/prebuild-install/**"]

# o servidor (/api, /uploads, /sitemap.xml, /robots.txt) e as tarefas de 15 em 15 minutos
# estão configurados nos próprios ficheiros em netlify/functions

# endereços curtos e páginas antigas
[[redirects]]
  from = "/painel"
  to = "/admin/"
  status = 302
[[redirects]]
  from = "/painel/"
  to = "/admin/"
  status = 302
[[redirects]]
  from = "/avaliacoes.html"
  to = "/#fb-sec"
  status = 301
[[redirects]]
  from = "/sobre.html"
  to = "/espaco.html"
  status = 301
[[redirects]]
  from = "/precario.html"
  to = "/servicos.html"
  status = 301
[[redirects]]
  from = "/favicon.ico"
  to = "/favicon.svg"
  status = 301

# páginas e scripts sempre atualizados depois de cada publicação
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
